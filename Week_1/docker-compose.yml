version: '3.9'

services:
  backend:
    build: ./backend
    container_name: voltstream-api
    ports:
      - "8000:8000"
    environment:
      - ENV=development
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # Points the built React app at the backend exposed on localhost:8000
        VITE_API_URL: http://localhost:8000
    container_name: voltstream-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: voltstream-net
